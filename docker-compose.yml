services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - TORCH_VERSION=${TORCH_VERSION:-cpu}
    container_name: warptorch-backend
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001,http://frontend:3001}
    volumes:
      # Mount core directory for development (comment out for production)
      - ./core:/app/core:ro
      - ./output:/app/output
    networks:
      - warptorch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: warptorch-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - warptorch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  warptorch-network:
    driver: bridge

volumes:
  output-data:
    driver: local
